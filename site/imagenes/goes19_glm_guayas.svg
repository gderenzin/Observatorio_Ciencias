  <rect x="40" y="40" width="230" height="32" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="55" y="61" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">GEOSTATIONARY: GOES-19</text>
  
  <text x="40" y="115" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Telemetría GLM de Convección</text>
  <text x="40" y="145" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Golfo de Guayaquil & Litoral • ABI Canal 13 (10.3 μm)</text>
  
  <!-- Cajas de Métricas Operativas -->
  <rect x="40" y="180" width="180" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b">CADENCIA DE INGESTA</text>
  <text x="55" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#facc15">20 SEGUNDOS</text>
  
  <rect x="240" y="180" width="180" height="60" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="255" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#818cf8">PLANCK ABI B13</text>
  <text x="255" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#818cf8">-72°C (TORMENTA)</text>

  <!-- Pie técnico -->
  <text x="40" y="415" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">PIPELINE NETCDF4 EN DEBIAN 13 • GEO.EUROAMERICANO.EDU.EC</text>
  <text x="680" y="415" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">BOLETÍN DERENZIN</text>
