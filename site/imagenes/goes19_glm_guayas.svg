<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090a1a"/>
    </linearGradient>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#312e81" stroke-width="0.6" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  <rect width="800" height="450" fill="url(#grid3)"/>

  <!-- Radar de Rayos y Descargas GLM -->
  <circle cx="600" cy="220" r="150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="600" cy="220" r="100" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5"/>
  <circle cx="600" cy="220" r="50" fill="#4338ca" fill-opacity="0.3"/>
  
  <!-- Relámpagos GLM -->
  <path d="M 580 120 L 595 180 L 575 195 L 610 270 L 590 280 L 620 340" fill="none" stroke="#facc15" stroke-width="3" filter="drop-shadow(0 0 8px #eab308)"/>
  <path d="M 640 160 L 650 200 L 635 210 L 655 260" fill="none" stroke="#fde047" stroke-width="2"/>
  
  <!-- Círculos de eventos GLM -->
  <circle cx="560" cy="230" r="12" fill="#ef4444" fill-opacity="0.6"/>
  <circle cx="630" cy="240" r="18" fill="#f59e0b" fill-opacity="0.5"/>
  <circle cx="610" cy="190" r="24" fill="#eab308" fill-opacity="0.4"/>

