<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="60%" stop-color="#0c1838"/>
      <stop offset="100%" stop-color="#081026"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="35%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070d1e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridMap" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <style>
      @keyframes pulseRing {
        0% { r: 3; opacity: 1; }
        100% { r: 12; opacity: 0; }
      }
      @keyframes strikeFlash {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .ring-anim { animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
      .ring-anim-delay { animation: pulseRing 2.2s 0.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
      .flash-anim { animation: strikeFlash 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Fondo Oceánico y Cuadrícula Batimétrica -->
  <rect width="400" height="240" fill="url(#oceanGrad)"/>
  <rect width="400" height="240" fill="url(#gridMap)"/>
  <circle cx="160" cy="150" r="140" fill="url(#radarSweep)"/>

  <!-- Anillos Radar de Cobertura Costera (Centro Península de Santa Elena) -->
  <circle cx="165" cy="145" r="35" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.4"/>
  <circle cx="165" cy="145" r="75" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.3"/>
  <circle cx="165" cy="145" r="115" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.2"/>

  <!-- Silueta Geográfica Simplificada del Litoral y Ecuador Continental -->
  <!-- Costa: Esmeraldas -> Cabo San Francisco -> Bahía -> Manta -> Sta Elena -> Golfo Guayaquil -> Pto Bolívar -->
  <path d="M 235 15 
           L 215 32 
           L 185 45 
           L 175 62 
           L 180 82 
           L 165 98 
           L 155 125 
           L 142 142 
           L 165 148 
           L 185 140 
           L 195 158 
           L 175 168 
           L 170 188 
           L 185 205 
           L 205 228 
           L 385 228 
           L 385 15 Z" 
        fill="#132347" stroke="#334d80" stroke-width="1.2"/>

  <!-- Línea Costera Resaltada (Litoral Pacífico) -->
  <path d="M 235 15 
           L 215 32 
           L 185 45 
           L 175 62 
           L 180 82 
           L 165 98 
           L 155 125 
           L 142 142 
           L 165 148 
           L 185 140 
           L 195 158 
           L 175 168 
           L 170 188 
           L 185 205 
           L 205 228" 
        fill="none" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 0 3px #0284c7)"/>

  <!-- Golfo de Guayaquil e Isla Puná -->
  <path d="M 172 172 L 186 168 L 188 178 L 176 182 Z" fill="#1c3566" stroke="#38bdf8" stroke-width="0.8"/>

  <!-- Nube Térmica Convectiva GOES-19 ABI B13 (-65°C a -72°C sobre el Golfo y Cuenca Baja) -->
  <path d="M 160 135 Q 180 120 205 130 Q 225 145 210 170 Q 185 180 165 165 Z" 
        fill="#dc2626" fill-opacity="0.38" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="188" cy="150" r="14" fill="#facc15" fill-opacity="0.35"/>

  <!-- Descargas Eléctricas GLM (Rayos en vivo detectados por satélite) -->
  <polygon points="186,138 181,146 187,147 183,156 193,145 187,144" fill="#fde047" class="flash-anim"/>
  <circle cx="196" cy="162" r="3" fill="#eab308" class="flash-anim"/>
  <circle cx="178" cy="132" r="2.5" fill="#facc15" class="flash-anim"/>

  <!-- Mareógrafos UNESCO / INOCAR (Puntos de Monitoreo de Pleamar y Nivel del Mar) -->
  <!-- 1. Esmeraldas -->
  <circle cx="185" cy="45" r="3.5" fill="#10b981"/>
  <circle cx="185" cy="45" r="3.5" fill="none" stroke="#10b981" stroke-width="1" class="ring-anim"/>
  <text x="125" y="48" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">Esmeraldas</text>

  <!-- 2. Manta -->
  <circle cx="165" cy="98" r="3.5" fill="#10b981"/>
  <circle cx="165" cy="98" r="3.5" fill="none" stroke="#10b981" stroke-width="1" class="ring-anim-delay"/>
  <text x="126" y="101" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">Manta</text>

  <!-- 3. La Libertad (Península Santa Elena) -->
  <circle cx="142" cy="142" r="4" fill="#38bdf8"/>
  <circle cx="142" cy="142" r="4" fill="none" stroke="#38bdf8" stroke-width="1.2" class="ring-anim"/>
  <text x="82" y="145" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#38bdf8">La Libertad</text>

  <!-- 4. Guayaquil (Puerto Limítrofe / Río Guayas) -->
  <circle cx="192" cy="154" r="4" fill="#f59e0b"/>
  <circle cx="192" cy="154" r="4" fill="none" stroke="#f59e0b" stroke-width="1" class="ring-anim-delay"/>
  <text x="202" y="157" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fde68a">Guayaquil</text>

  <!-- 5. Puerto Bolívar (El Oro) -->
  <circle cx="170" cy="188" r="3.5" fill="#10b981"/>
  <circle cx="170" cy="188" r="3.5" fill="none" stroke="#10b981" stroke-width="1" class="ring-anim"/>
  <text x="100" y="191" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">Pto. Bolívar</text>

  <!-- Cuadro Inset Galápagos (Océano Pacífico Oriental) -->
  <rect x="12" y="12" width="70" height="52" rx="3" fill="#070d1e" stroke="#1e3a8a" stroke-width="0.8"/>
  <text x="17" y="24" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#93c5fd" letter-spacing="0.5">GALÁPAGOS</text>
  <ellipse cx="44" cy="40" rx="6" ry="10" fill="#1e3a8a" stroke="#38bdf8" stroke-width="0.6"/>
  <circle cx="56" cy="38" r="4" fill="#1e3a8a" stroke="#38bdf8" stroke-width="0.6"/>
  <circle cx="48" cy="48" r="2.5" fill="#10b981"/>
  <circle cx="48" cy="48" r="2.5" fill="none" stroke="#10b981" stroke-width="0.8" class="ring-anim"/>
  <text x="17" y="58" font-family="'Inter', sans-serif" font-size="6.5" fill="#64748b">Sta. Cruz · IOC</text>

  <!-- Encabezado y Badges de Telemetría -->
  <rect x="220" y="10" width="170" height="20" rx="3" fill="#030712" fill-opacity="0.85" stroke="#1e293b" stroke-width="0.6"/>
  <circle cx="230" cy="20" r="3" fill="#22c55e"/>
  <text x="238" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#4ade80">RADAR & MAREÓGRAFOS</text>

  <!-- Pie de Control Satelital -->
  <rect x="0" y="218" width="400" height="22" fill="#030712" fill-opacity="0.9"/>
  <text x="12" y="233" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">GOES-19 ABI/GLM (20s) · RED MAREOGRÁFICA UNESCO/IOC</text>
  <text x="345" y="233" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8">EN VIVO ↗</text>
</svg>
