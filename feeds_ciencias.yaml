# ==============================================================================
# OBSERVATORIO DE CIENCIAS DE LA TIERRA, TELEDETECCIÓN Y CLIMA ESPACIAL
# LISTA BLANCA (ALLOWLIST) DE FUENTES CIENTÍFICAS CON DOI Y PREPRINTS (PETERS & CHIN-YEE 2025 COMPLIANT)
# ==============================================================================
# Regla de Oro (Peters & Chin-Yee, Roy. Soc. Open Sci. 2025):
# 1. Toda fuente externa debe tener DOI verificable o URL canónica de agencia.
# 2. Los preprints se clasifican OBLIGATORIAMENTE como "No revisado por pares".
# 3. Nada pasa a producción en automático: pasan a borradores_pendientes.yaml
#    para revisión humana de F. Derenzin antes de publicarse.
# ==============================================================================

fuentes:
  # --- PREPRINTS CIENTÍFICOS (Obligatorio flag es_preprint: true) ---
  - nombre: "EarthArXiv - Preprints en Ciencias de la Tierra"
    url: "https://eartharxiv.org/repository/rss/"
    dominio: "eartharxiv.org"
    idioma: en
    es_preprint: true
    categoria: "preprints_ciencias_tierra"
    descripcion: "Preprints abiertos en geomática, teledetección, hidrología y ciencias del suelo (no revisados por pares)."

  - nombre: "arXiv - Geofísica y Física Atmosférica (physics.geo-ph)"
    url: "https://rss.arxiv.org/rss/physics.geo-ph"
    dominio: "arxiv.org"
    idioma: en
    es_preprint: true
    categoria: "preprints_geofisica"
    descripcion: "Preprints rigurosos de física planetaria, dinámica atmosférica y modelado numérico (no revisados por pares)."

  - nombre: "arXiv - Heliofísica y Clima Espacial (astro-ph.SR)"
    url: "https://rss.arxiv.org/rss/astro-ph.SR"
    dominio: "arxiv.org"
    idioma: en
    es_preprint: true
    categoria: "preprints_heliofisica"
    descripcion: "Investigaciones pre-print en física solar, viento solar, eyecciones de masa coronal (CME) y clima espacial."

  # --- REVISTAS Y PUBLICACIONES CIENTÍFICAS CON DOI ---
  - nombre: "Copernicus Publications (EGU - Hydrology & Earth System Sciences)"
    url: "https://hess.copernicus.org/xml/rss2_0.xml"
    dominio: "copernicus.org"
    idioma: en
    es_preprint: false
    categoria: "hidrologia_teledeteccion"
    descripcion: "Artículos revisados por pares con DOI sobre hidrología satelital, dinámica de cuencas y balance hídrico."

  - nombre: "Copernicus Publications (EGU - Annales Geophysicae)"
    url: "https://angeo.copernicus.org/xml/rss2_0.xml"
    dominio: "copernicus.org"
    idioma: en
    es_preprint: false
    categoria: "geofisica_ionosfera"
    descripcion: "Investigaciones revisadas por pares con DOI en física ionosférica ecuatorial y acoplamiento solar-terrestre."

  # --- AGENCIA ESPACIAL OFICIAL (BOLETINES TÉCNICOS / MISSION DISPATCHES) ---
  - nombre: "ESA - Earth Observation Technical Missions"
    url: "https://www.esa.int/rssfeed/Our_Activities/Observing_the_Earth"
    dominio: "esa.int"
    idioma: en
    es_preprint: false
    es_comunicado_tecnico: true
    categoria: "misiones_satelitales_esa"
    descripcion: "Reportes técnicos y operacionales de la constelación Sentinel y satélites Earth Explorers."
