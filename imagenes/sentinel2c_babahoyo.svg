<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#142838"/>
      <stop offset="100%" stop-color="#08101a"/>
    </linearGradient>
    <pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e3a5f" stroke-width="0.7" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <!-- Cuadrícula 805 Píxeles de Babahoyo -->
  <g opacity="0.3" stroke="#0ea5e9" stroke-width="0.75" fill="none">
    <rect x="480" y="80" width="260" height="260"/>
    <line x1="545" y1="80" x2="545" y2="340"/>
    <line x1="610" y1="80" x2="610" y2="340"/>
    <line x1="675" y1="80" x2="675" y2="340"/>
    <line x1="480" y1="145" x2="740" y2="145"/>
    <line x1="480" y1="210" x2="740" y2="210"/>
    <line x1="480" y1="275" x2="740" y2="275"/>
  </g>
  
  <!-- Heatmap espectral píxeles de arroz -->
  <rect x="545" y="145" width="65" height="65" fill="#10b981" fill-opacity="0.5"/>
  <rect x="610" y="145" width="65" height="65" fill="#059669" fill-opacity="0.6"/>
  <rect x="610" y="210" width="65" height="65" fill="#34d399" fill-opacity="0.4"/>
  <rect x="545" y="210" width="65" height="65" fill="#10b981" fill-opacity="0.45"/>

  <!-- Curvas Comparativas NDVI vs NDRE -->
  <path d="M 80 320 Q 200 310 280 180 T 420 160" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M 80 340 Q 200 330 280 250 T 420 190" fill="none" stroke="#38bdf8" stroke-width="3.5"/>

  <!-- Telemetría & Textos Técnicos -->
  <rect x="40" y="40" width="240" height="32" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="55" y="61" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">MISSION: SENTINEL-2C L2A</text>
  
  <text x="40" y="115" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Saturación del Dosel: NDVI vs NDRE</text>
  <text x="40" y="145" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Cultivos Arroceros de San Román, Babahoyo • 805 Píxeles</text>
  
  <!-- Cajas de Comparación Espectral -->
  <rect x="40" y="180" width="180" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ef4444">NDVI (SATURADO)</text>
  <text x="55" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ef4444">0.831 (Plano)</text>
  
  <rect x="240" y="180" width="180" height="60" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="255" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">NDRE (BORDE ROJO B05)</text>
  <text x="255" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#38bdf8">0.568 (Sensible)</text>

  <!-- Pie técnico -->
  <text x="40" y="415" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">BANCO DE PRUEBAS AGRO-HIDROLÓGICO • BANDA 05 (705nm) • CUENCA BAJA</text>
  <text x="680" y="415" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">BOLETÍN DERENZIN</text>
</svg>
