<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#3b1d08"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad4)"/>

  <!-- Sol & Corona Solar -->
  <circle cx="650" cy="220" r="160" fill="url(#sunGlow)" opacity="0.8"/>
  <circle cx="650" cy="220" r="75" fill="#fef08a"/>
  
  <!-- Bucles Magnéticos y Viento Solar -->
  <path d="M 650 145 Q 690 100 730 145" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.8"/>
  <path d="M 580 180 Q 520 220 580 260" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
  
  <!-- Ondas de Radio Ionosféricas perturbadas -->
  <path d="M 280 220 Q 380 200 480 220" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 280 250 Q 380 290 480 250" fill="none" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Telemetría & Textos Técnicos -->
  <rect x="40" y="40" width="230" height="32" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="55" y="61" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fde047" letter-spacing="1">HELIOFÍSICA: CICLO 25</text>
  
  <text x="40" y="115" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Clima Espacial & Riesgo RTK</text>
  <text x="40" y="145" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Ionosfera Ecuatorial • Rayos X Solares & Centelleo GNSS</text>
  
  <!-- Cajas de Métricas Heliofísicas -->
  <rect x="40" y="180" width="180" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b">FLUJO RAYOS X (GOES)</text>
  <text x="55" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#f59e0b">CLASE M / X</text>
  
  <rect x="240" y="180" width="180" height="60" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="255" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#fde047">ÍNDICE Kp PLANETARIO</text>
  <text x="255" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ef4444">Kp &gt; 5 (TORMENTA)</text>

  <!-- Pie técnico -->
  <text x="40" y="415" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">TELEMETRÍA EN VIVO • ESPACIAL.EUROAMERICANO.EDU.EC • NOAA SWPC</text>
  <text x="680" y="415" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">BOLETÍN DERENZIN</text>
</svg>
