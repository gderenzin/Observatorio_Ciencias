  <circle cx="240" cy="240" r="4" fill="#34d399"/>
  <circle cx="340" cy="210" r="4" fill="#34d399"/>
  <circle cx="390" cy="270" r="4" fill="#34d399"/>
  <circle cx="330" cy="320" r="4" fill="#34d399"/>
  <circle cx="220" cy="300" r="4" fill="#34d399"/>

