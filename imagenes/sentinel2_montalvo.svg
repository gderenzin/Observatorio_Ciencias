  <text x="55" y="61" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">MISSION: SENTINEL-2 L2A</text>
  
  <text x="40" y="115" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Monitoreo de Estrés Hídrico</text>
  <text x="40" y="145" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Cuenca de Montalvo, Los Ríos • 22.42 Hectáreas</text>
  
  <!-- Caja de Índices -->
  <rect x="40" y="180" width="160" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b">NDVI (VIGOR)</text>
  <text x="55" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#10b981">0.825 SAT</text>
  
  <rect x="220" y="180" width="160" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="235" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b">NDMI (AGUA FOLIAR)</text>
  <text x="235" y="228" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#f59e0b">0.284 ALERTA</text>

