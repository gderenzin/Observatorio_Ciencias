<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e3a5f" stroke-width="0.75" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  <rect width="800" height="450" fill="url(#grid1)"/>
  
  <!-- Satélite Orbitando & Ondas -->
  <circle cx="620" cy="180" r="140" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
