  <circle cx="620" cy="180" r="40" fill="#0369a1" fill-opacity="0.2"/>
  
  <!-- Curva Espectral SVG -->
  <path d="M 120 340 Q 220 330 300 240 T 460 140 T 600 130 T 720 180" fill="none" stroke="#10b981" stroke-width="3"/>
  <path d="M 120 340 Q 220 330 300 240 T 460 140 T 600 130 T 720 180 L 720 380 L 120 380 Z" fill="#10b981" fill-opacity="0.08"/>
  
